# Claims API - centralized config (overrides shared defaults)
issuers: ${COGNITO_ISSUER_URL:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_4atAJ9eRI}
issuers-keys: ${COGNITO_ISSUER_URL:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_4atAJ9eRI}/.well-known/jwks.json
audiences: ${COGNITO_AUDIENCE:20kkrgk5cghmtoc31jsq8mmshi,3qj47e7b7cd6augv7ginnqef8,4d38h6sca3bnn33fm89pb38kt2,3q49aa6mhrnjhmhcm7ta9uj28k,4g0b4tur4t21626l1d4kklocbk,740q1732m5lppmftml59ub2nvi}

server:
  port: 9020

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

kafka:
  consumerGroupId: ${KAFKA_CONSUMER_GROUP:velaris-claims}
  legacyClaimsTopic: ${KAFKA_CLAIMS_TOPIC:velaris-claims}

aws:
  s3:
    # No default: S3_CLAIMS_BUCKET is set on every deployed pod by the k8s base
    # deployment (velaris-claims-files-SECRET_ENV, resolved per overlay). This
    # previously defaulted to the dev bucket, so prod claim-evidence uploads
    # targeted a bucket in the DEV account and 403'd against the prod pod role
    # (VEL-615). Failing startup beats silently writing to the wrong account.
    bucket: ${S3_CLAIMS_BUCKET}
    region: ${AWS_REGION:us-east-1}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}

management:
  server:
    port: 8094

# velaris-orders internal claim-lookup surface: resolves claim tokens and
# reservation references for the anonymous file-a-claim wizard. The internal
# token must match orders' velaris.claims.internal-token.
#
# VELARIS_INTERNAL_TOKEN is the fleet-wide fallback: setting that one variable
# on claims-api, orders, policy-api and partner-api rotates every
# internal-token pair together (a per-pair name still wins where set). These
# peer endpoints are permitAll() behind an internet-facing ALB, so the token is
# the ONLY credential — the local-dev default must never survive into a
# deployed environment (VEL-616).
velaris:
  orders:
    base-url: http://orders.velaris.svc.cluster.local:9080
    internal-token: ${ORDERS_INTERNAL_TOKEN:${VELARIS_INTERNAL_TOKEN:local-dev-internal-token}}
  # velaris-policy-api internal owner-documents surface (VEL-568): resolves the
  # Recorded Elections Extract (OA-1E) governing a stay for the guest-damage
  # adjudication receipt gate. The token must match policy-api's
  # velaris.billing.internal-token.
  policy-api:
    base-url: http://policy-api.velaris.svc.cluster.local:9030
  billing:
    internal-token: ${BILLING_INTERNAL_TOKEN:${VELARIS_INTERNAL_TOKEN:local-dev-internal-token}}
