# Velaris Flags service - centralized config (overrides shared defaults)
# Folder name matches the client's spring.application.name: velaris-flags
issuers: ${COGNITO_ISSUER_URL:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_4atAJ9eRI}
issuers-keys: ${COGNITO_ISSUER_URL:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_4atAJ9eRI}/.well-known/jwks.json
audiences: ${COGNITO_AUDIENCE:20kkrgk5cghmtoc31jsq8mmshi,3qj47e7b7cd6augv7ginnqef8,4d38h6sca3bnn33fm89pb38kt2,3q49aa6mhrnjhmhcm7ta9uj28k,4g0b4tur4t21626l1d4kklocbk,740q1732m5lppmftml59ub2nvi}

server:
  port: 9180
  # h2c disabled (overrides the shared fleet-wide http2.enabled=true):
  # Tomcat 11.0.20 leaks the upgraded connection's processor + request
  # buffers when the server's h2 idle timeout closes an h2c connection.
  # velaris-notification's 60s flag poll hit that path once a minute
  # (~33KB each) and OOM'd flags-api every ~2 days. In-cluster and
  # ALB→target traffic is HTTP/1.1; nothing needs cleartext HTTP/2.
  http2:
    enabled: false

kafka:
  flagChangedTopic: ${KAFKA_FLAG_CHANGED_TOPIC:velaris.flag-changed}
  partitions:
    default: 3
  replicas:
    default: 2

management:
  server:
    port: 8098
